<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">
  <style>
    body {
      background-color: #0F0F0F;
      display: flex;
      justify-content: center;
      /* Centers horizontally */
      align-items: center;
      /* Centers vertically */
      height: 100vh;
      margin: 0;
      font-family: Montserrat;
      font-size: 1.5rem;
      font-weight: 500;
    }

    .welcome {
      width: 500px;
      height: 170px;
      color: #B8AEA2;
      text-align: center;
      font-weight: 500;
    }

    #highlight {
      color: #ABFC00;
    }

    #go-to {
      list-style-type: none;
      text-decoration: none;
      font-size: 1rem;
      color: #B8AEA2;
      opacity: .5;
      transition: opacity 0.5s ease;
    }

    #go-to:hover {
      opacity: 1;
    }

    #go-to img {
      width: 20px;
      height: 20px;
      vertical-align: middle;
      margin-right: 15px;
      margin-bottom: 8px;
    }


    @media screen and (min-width: 600px) {
      body {
        font-size: 3rem;
      }

      #go-to {
        font-size: 1.5rem;
      } 
      
    }
  </style>
  <title>Wilson</title>
</head>

<body>
  <header class="welcome">
    <p>Hello <span id="highlight">World</span></p>
    <a id="go-to" href="./wilson-portfolio/home/index.html">
      <img src="https://res.cloudinary.com/dbriapahp/image/upload/v1743940089/play_pdfeep.png" /> Start
    </a>
  </header>
</body>

</html>
